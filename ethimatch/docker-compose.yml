# EthiMatch — one-command reproducible deployment
# Usage:
#   docker compose up --build
#   Open http://localhost:8501

services:
  ethimatch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ethimatch-app
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      # Optional: mount MIMIC/bronze notes into the container at runtime
      ETHIMATCH_DATA_BRONZE: /app/data/bronze
      ETHIMATCH_DATA_SILVER: /app/data/silver
      ETHIMATCH_DATA_GOLD: /app/data/gold
    volumes:
      # Persist HuggingFace model cache between rebuilds
      - huggingface_cache:/root/.cache/huggingface
      # Local mock data lake (bronze / silver / gold) — bind-mount for reproducibility
      - ./data/bronze:/app/data/bronze
      - ./data/silver:/app/data/silver
      - ./data/gold:/app/data/gold
      # Optional: evaluation outputs
      - ./results:/app/results
    restart: unless-stopped

volumes:
  huggingface_cache:
    name: ethimatch-huggingface-cache
